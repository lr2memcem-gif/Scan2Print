<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIrhCeTAL4oYVwa3wwI0MdYAbD8vieKzKI7CpTCMmX18XbmBmfZXNYgXN2eG0yReSvNg/exec";

  let activeFile = null;
  const dropArea = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusDiv = document.getElementById('status');

  function resolveExtension(mimeType) {
    if (!mimeType) return 'pdf';

    const type = mimeType.toLowerCase();

    if (type.includes('spreadsheetml') || type.includes('excel')) return 'xlsx';
    if (type.includes('wordprocessingml') || type.includes('msword')) return 'docx';
    if (type.includes('presentationml') || type.includes('powerpoint')) return 'pptx';
    if (type.includes('csv')) return 'csv';
    if (type.includes('plain')) return 'txt';
    if (type.includes('jpeg')) return 'jpg';
    if (type.includes('png')) return 'png';
    if (type.includes('webp')) return 'webp';
    if (type.includes('pdf')) return 'pdf';

    return 'pdf';
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.has('shared')) {

      // Updated cache version
      const cache = await caches.open('scan2print-share-v3');

      const cachedResponse = await cache.match('incoming_share');

      if (cachedResponse) {
        const blob = await cachedResponse.blob();

        const rawName = cachedResponse.headers.get('X-Original-Name');

        let fileName = rawName
          ? decodeURIComponent(rawName)
          : '';

        if (
          !fileName ||
          fileName.startsWith('blob') ||
          !fileName.includes('.')
        ) {
          const ext = resolveExtension(blob.type);
          fileName = "Shared_Doc_" + Date.now() + "." + ext;
        }

        activeFile = new File(
          [blob],
          fileName,
          { type: blob.type }
        );

        displayFile(activeFile);

        await cache.delete('incoming_share');
      }
    }
  });

  dropArea.addEventListener('click', () => fileInput.click());

  dropArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.classList.add('dragover');
  });

  dropArea.addEventListener('dragleave', () => {
    dropArea.classList.remove('dragover');
  });

  dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.classList.remove('dragover');

    if (e.dataTransfer.files.length > 0) {
      activeFile = e.dataTransfer.files[0];
      displayFile(activeFile);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      activeFile = e.target.files[0];
      displayFile(activeFile);
    }
  });

  function displayFile(file) {
    fileInfo.textContent =
      `📄 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;

    fileInfo.style.display = 'block';

    uploadBtn.disabled = false;

    statusDiv.innerText = "";
  }

  function uploadCurrentFile() {

    if (!activeFile) return;

    // Block empty / 0-byte files
    if (activeFile.size === 0) {
      statusDiv.style.color = "var(--error)";
      statusDiv.innerText =
        "❌ File is empty (0.00 MB). Please pick the file directly.";

      uploadBtn.disabled = false;
      return;
    }

    uploadBtn.disabled = true;

    statusDiv.style.color = "var(--primary)";
    statusDiv.innerText = "⏳ Uploading to print queue...";

    const reader = new FileReader();

    reader.onload = function(e) {

      const base64Data = e.target.result.split(',')[1];

      const payload = {
        fileName: activeFile.name,
        mimeType: activeFile.type || "application/octet-stream",
        fileData: base64Data
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {

        statusDiv.style.color = "var(--success)";
        statusDiv.innerText =
          "✅ Queued successfully! Printing on station.";

        uploadBtn.disabled = true;
      })
      .catch(err => {

        statusDiv.style.color = "var(--error)";
        statusDiv.innerText =
          "❌ Upload Error: " + err.toString();

        uploadBtn.disabled = false;
      });
    };

    reader.readAsDataURL(activeFile);
  }
</script>
